  # Wave 1 — Foundation
  - id: T01
    title: Brand audit & design system bootstrap
    wave: 1
    priority: must
    complexity: 3
    depends_on: []
    description: |
      Full brand audit using .agents/skills/redesign-existing-projects fix
      priority order:
      1. Font swap — BioRhyme + DM Sans via next/font/google
      2. Colour cleanup — globals.css tokens to exact brand HEX
      3. Hover + active states across all interactive components
      4. Layout/spacing — max-width, grid, consistent padding
      5. Replace generic components — no Inter, no neon glows, no pure black
      6. Add missing load/empty/error states
      7. Typography scale polish
      Generate DESIGN.md skeleton via .agents/skills/stitch-design-taste.
      Apply .agents/skills/design-taste-frontend anti-pattern rules throughout.
    skills:
      - .agents/skills/redesign-existing-projects  # primary audit tool
      - .agents/skills/stitch-design-taste          # DESIGN.md generation
      - .agents/skills/design-taste-frontend        # baseline rules
    files_affected:
      - app/globals.css
      - app/layout.tsx
      - components/**
    acceptance_criteria:
      - globals.css contains only #DBFF66, #006F53, #06211A, #FFFFFF, #F4F4F5 tokens
      - BioRhyme + DM Sans loaded via next/font/google
      - No Inter, no pure black, no neon glows in any component
      - DESIGN.md exists at project root
      - Dark mode uses Night Forest bg, Neon Lime accents
      - Light mode uses Platinum bg, Viridian accents

