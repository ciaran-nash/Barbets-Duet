  AP1: []
  AP2: [AP1]
  AP3: [AP2]
  AP4: [AP3]
  AP5: [AP4]
  AP6: [AP3]
  AP7: [AP3]
  AP8: [AP3]

longest_chain:
  path: AP1 → AP2 → AP3 → AP4 → AP5
  tasks: 5
  total_complexity: 14

complexity_summary:
  total_tasks: 8
  total_complexity_points: 24
  wave_1: 7
  wave_2: 17
  sonnet_tasks: 8
  opus_tasks: 0
  high_risk_tasks: 0
  slicing: not required (24 points < 100 threshold)

orchestration:
  integration_cadence: worktree
  auto_merge_on_green: false
  review:
    trigger: per-wave
    scope: pr-diff
    skip_if_diff_under: null
    on_findings: block
  gates:
    model: pause
    count: 1
    placements:
      - after: wave_1
        label: Auth layer verified
        reason: >
          middleware.ts is a require_review boundary file. Human sign-off
          required before CRUD UI build begins.
    wave_2_gate: conditional

pre_requisites:
  - PR #9 (community schema) merged to feature/barbets-duet-full-build before execution
  - Supabase project credentials available (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY)
  - community-network waves 5-6 code merged (ContributionFeed, T&E form, peer review schema)

model_assignments:
  sonnet: [AP1, AP2, AP3, AP4, AP5, AP6, AP7, AP8]
  opus: []
