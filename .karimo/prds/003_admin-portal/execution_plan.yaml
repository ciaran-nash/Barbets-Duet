prd: admin-portal
generated: 2026-06-10

waves:
  wave_1:
    name: Auth & Shell
    tasks: [AP1, AP2, AP3]
    note: |
      Strict sequential order within wave:
        AP1 (Supabase helpers) → AP2 (middleware) → AP3 (layout shell)
      AP2 modifies middleware.ts — human review required before merging.
      Do not begin Wave 2 until Gate 1 passes.
    gate:
      label: Auth layer verified
      model: pause
      conditions:
        - middleware.ts reviewed by human (require_review boundary)
        - GET /admin without session redirects to /auth/login in local dev
        - GET /superadmin with coordinator session redirects to /403
        - Arcjet volunteer/donation rate limiting confirmed active after changes
        - TypeScript strict mode passes (npx tsc --noEmit)
        - next build clean (no new errors)
      rationale: |
        Middleware + RLS are the security layer. All Wave 2 CRUD UI depends on
        correct auth gating. A bug here affects all subsequent tasks.
        Pause gate mandated — not conditional/auto-pass.

  wave_2:
    name: CRUD UI
    tasks: [AP4, AP5, AP6, AP7, AP8]
    depends_on: wave_1
    note: |
      AP4 and AP5 are sequential (AP5 wires into AP4 components).
      AP6, AP7, AP8 all depend only on AP3 (layout) and can run in parallel
      with each other and with AP4/AP5.
      Recommended parallel grouping:
        Group A: AP4 → AP5 (T&E moderation flow)
        Group B: AP6 (members) — parallel with Group A
        Group C: AP7 (peer review) — parallel with Groups A and B
        Group D: AP8 (pentangles) — parallel with Groups A, B, C
    gate:
      label: Admin portal feature-complete
      model: conditional
      conditions:
        - All 8 tasks status = done
        - Coordinator session flow tested end-to-end (login → T&E queue → publish)
        - Admin session flow tested (login → members → role change → pentangles)
        - TypeScript strict mode passes
        - next build clean
        - WCAG 2.2 AA spot-check on T&E queue and member list

